<h2>Detalles del entrenamiento</h2>

@if (workoutData.workouts.length === 0) {
  <p>No hay entrenamientos registrados</p>
} @else {
  <p id="workout-details-date-text">{{ workoutData.workouts[0].date | date: 'dd/MM/yyyy' }}</p>
}

<table>
  <thead>
    <tr>
      <th>Ejercicio</th>
      <th>Series</th>
      <th>Repeticiones</th>
      <th>Peso (kg)</th>
    </tr>
  </thead>

  <tbody id="workout-exercise-rows"></tbody>
</table>

<button class="secondary-button" type="button" id="back-to-history-button">
  Volver al historial
</button>
