<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entrenamiento</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
  </head>

  <body>
    <h1>Entrenamiento App v1.0</h1>

    <section id="workout-history-section">
      <h2>Historial de entrenamientos</h2>

      <button id="new-workout-button" type="button">Nuevo entrenamiento</button>

      <ul id="workout-history-list" class="workout-history"></ul>
    </section>

    <section id="new-workout-section">
      <h2>Nuevo entrenamiento</h2>

      <label for="workout-date-input">Fecha</label>
      <input type="date" id="workout-date-input" />

      <h3>Añadir ejercicio</h3>

      <label for="exercise-name-input">Ejercicio</label>
      <input type="text" id="exercise-name-input" />

      <label for="exercise-sets-input">Series</label>
      <input type="number" id="exercise-sets-input" />

      <label for="exercise-reps-input">Repeticiones</label>
      <input type="number" id="exercise-reps-input" />

      <label for="exercise-weight-input">Peso</label>
      <input type="number" id="exercise-weight-input" />

      <button type="button" id="add-exercise-button">Añadir ejercicio</button>

      <h3>Ejercicios registrados</h3>

      <ul id="current-workout-exercise-list">
        <!-- Aquí aparecen los ejercicios ya registrados del entrenamiento -->
      </ul>

      <div class="button-container">
        <button type="button" id="save-workout-button">Guardar entrenamiento</button>
        <button id="cancel-workout-button" class="secondary-button" type="button">Cancelar</button>
      </div>
    </section>

    <section id="workout-details-section">
      <h2>Detalles del entrenamiento</h2>

      <p id="workout-details-date-text"></p>

      <table>
        <thead>
          <tr>
            <th>Ejercicio</th>
            <th>Series</th>
            <th>Repeticiones</th>
            <th>Peso (kg)</th>
          </tr>
        </thead>

        <tbody id="workout-exercise-rows">
        </tbody>
      </table>

      <button class="secondary-button" type="button" id="back-to-history-button">Volver al historial</button>
    </section>

    <script src="app.js"></script>
  </body>
</html>
