<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entrenamiento</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <h1>Entrenamiento App v1.0</h1>

    <section>
      <h2>Historial de entrenamientos</h2>

      <ul id="historial-entrenamientos"></ul>
    </section>

    <section id="nuevo-entrenamiento">
      <h2>Nuevo entrenamiento</h2>

      <label for="fecha-entrenamiento">Fecha</label>
      <input type="date" id="fecha-entrenamiento" />

      <h3>Añadir ejercicio</h3>

      <label for="nombre">Ejercicio</label>
      <input type="text" id="nombre" />

      <label for="series">Series</label>
      <input type="number" id="series" />

      <label for="repeticiones">Repeticiones</label>
      <input type="number" id="repeticiones" />

      <label for="peso">Peso</label>
      <input type="number" id="peso" />

      <button type="button" id="anadir-ejercicio">Añadir ejercicio</button>

      <h3>Ejercicios registrados</h3>

      <ul id="ejerciciosRegistrados">
        <!-- Aquí aparecen los ejercicios ya registrados del entrenamiento -->
      </ul>

      <button type="button" id="guardar-entrenamiento">Guardar entrenamiento</button>
    </section>

    <section id="detalles-entrenamiento">
      <h2>Detalles del entrenamiento</h2>

      <p id="fecha-detalle-entrenamiento"></p>

      <table>
        <thead>
          <tr>
            <th>Ejercicio</th>
            <th>Series</th>
            <th>Repeticiones</th>
            <th>Peso (kg)</th>
          </tr>
        </thead>

        <tbody id="filas-ejercicios">
          <tr></tr>

          <tr></tr>

          <tr></tr>
        </tbody>
      </table>

      <button type="button">Volver al historial</button>
    </section>

    <script src="app.js"></script>
  </body>
</html>
